server {
    listen 80;
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Keep browser requests on localhost and forward API traffic inside Docker.
    # This prevents CORS failures and keeps the backend port private to Docker.
    location /api/ {
        proxy_pass http://backend:1000/api/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:1000/uploads/;
        proxy_set_header Host $host;
    }
}
