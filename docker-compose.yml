services:

  backend:
    build:
      context: ./backend
    container_name: sms-backend
    ports:
      - "1000:1000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:1000
    container_name: sms-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped