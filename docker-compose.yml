services:

  backend:
    build:
      context: ./backend
    container_name: sms-backend
    ports:
      - "1000:1000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: sms-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
